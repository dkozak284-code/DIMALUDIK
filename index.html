<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOVER PIT 3D: MOBILE EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --color-bg: #020503;
            --color-panel: rgba(6, 15, 8, 0.92);
            --color-border: #1a3821;
            --color-neon-green: #00ff66;
            --color-neon-gold: #ffd700;
            --color-neon-red: #ff3344;
            --color-neon-purple: #b042ff;
            --font-main: 'Share Tech Mono', monospace;
            --font-hud: 'VT323', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--color-bg);
            color: #e0ffe8;
            font-family: var(--font-main);
            overflow: hidden;
        }

        #webgl-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* HUD Header */
        .ui-hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            pointer-events: none;
        }

        .interactive { pointer-events: auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .logo {
            font-family: var(--font-hud);
            font-size: 1.3rem;
            color: var(--color-neon-green);
        }

        .stats-group { display: flex; gap: 6px; }

        .stat-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--color-border);
            padding: 2px 6px;
            border-radius: 4px;
            text-align: center;
            min-width: 55px;
        }

        .stat-card .label { font-size: 0.55rem; color: #6a9c74; }
        .stat-card .val {
            font-family: var(--font-hud);
            font-size: 1.1rem;
            color: var(--color-neon-gold);
            line-height: 1;
        }
        .stat-card .val.green { color: var(--color-neon-green); }
        .stat-card .val.red { color: var(--color-neon-red); }

        /* Crosshair & Prompts */
        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            border: 1px solid var(--color-neon-green);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
        }

        .interaction-prompt {
            position: absolute;
            top: 42%; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--color-neon-green);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--color-neon-green);
            pointer-events: none;
            display: none;
            text-align: center;
        }

        /* Mobile Touch Controls Layer */
        .touch-controls {
            position: absolute;
            bottom: 10px; left: 0; width: 100%;
            height: 140px;
            z-index: 15;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            pointer-events: none;
        }

        .dpad-container {
            width: 120px; height: 120px;
            position: relative;
            pointer-events: auto;
        }

        .dpad-btn {
            position: absolute;
            width: 38px; height: 38px;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid var(--color-neon-green);
            color: var(--color-neon-green);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .dpad-btn:active { background: var(--color-neon-green); color: #000; }
        .dpad-up { top: 0; left: 41px; }
        .dpad-down { bottom: 0; left: 41px; }
        .dpad-left { top: 41px; left: 0; }
        .dpad-right { top: 41px; right: 0; }

        .action-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .btn-action {
            width: 80px; height: 50px;
            background: #184a22;
            border: 1px solid var(--color-neon-green);
            color: var(--color-neon-green);
            font-family: var(--font-hud);
            font-size: 1.2rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:active { background: var(--color-neon-green); color: #000; }

        /* Touch Look Area */
        .touch-look-zone {
            position: absolute;
            top: 0; right: 0; width: 50%; height: 100%;
            z-index: 4;
            touch-action: none;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .modal-card {
            background: #0a140d;
            border: 1px solid var(--color-neon-green);
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-title {
            font-family: var(--font-hud);
            font-size: 1.5rem;
            color: var(--color-neon-gold);
            text-align: center;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 4px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 6px;
            overflow-y: auto;
            max-height: 55vh;
            padding-right: 4px;
        }

        .shop-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2px;
        }

        .shop-card-icon { font-size: 1.4rem; }
        .shop-card-title { font-size: 0.75rem; color: var(--color-neon-green); }
        .shop-card-desc { font-size: 0.6rem; color: #82a88a; flex: 1; }

        .btn {
            background: #0e2b14;
            color: var(--color-neon-green);
            border: 1px solid var(--color-neon-green);
            padding: 6px 12px;
            font-family: var(--font-main);
            font-size: 0.75rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn:disabled { opacity: 0.4; border-color: #333; color: #666; }
    </style>
</head>
<body>

    <div class="touch-look-zone" id="touchLookZone"></div>
    <div class="crosshair"></div>
    <div class="interaction-prompt" id="uiPrompt">Подойдите ближе</div>
    <div id="webgl-container"></div>

    <!-- HUD -->
    <div class="ui-hud">
        <header class="interactive">
            <div class="logo">☘ CLOVER PIT</div>
            <div class="stats-group">
                <div class="stat-card"><div class="label">Монеты</div><div class="val" id="uiCoins">40</div></div>
                <div class="stat-card"><div class="label">Аренда</div><div class="val red" id="uiQuota">100</div></div>
                <div class="stat-card"><div class="label">Спины</div><div class="val green" id="uiSpins">5</div></div>
            </div>
        </header>

        <!-- Mobile Touch Controls -->
        <div class="touch-controls">
            <div class="dpad-container">
                <div class="dpad-btn dpad-up" id="btnUp">▲</div>
                <div class="dpad-btn dpad-down" id="btnDown">▼</div>
                <div class="dpad-btn dpad-left" id="btnLeft">◀</div>
                <div class="dpad-btn dpad-right" id="btnRight">▶</div>
            </div>

            <div class="action-container">
                <button class="btn-action" id="btnInteract" onclick="executeInteraction()">[ Е ]</button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay interactive" id="shopModal">
        <div class="modal-card">
            <div class="modal-title">МАГАЗИН АРТЕФАКТОВ</div>
            <div class="shop-grid" id="shopGrid"></div>
            <button class="btn" onclick="closeModal('shopModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="modal-overlay interactive" id="deckModal">
        <div class="modal-card">
            <div class="modal-title">СОСТАВ КОЛОДЫ</div>
            <div class="shop-grid" id="deckGrid"></div>
            <button class="btn" onclick="closeModal('deckModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        /* Audio Engine */
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type = 'sine', duration = 0.08, vol = 0.05) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
        }
        const audio = new AudioEngine();

        /* Artifacts List (12 unique items) */
        const ARTIFACTS_DATABASE = [
            { id: 'clover_master', name: 'Золотой Клевер', icon: '🍀', desc: '+40% к Клеверу', cost: 35 },
            { id: 'magnet', name: 'Магнит Монет', icon: '🧲', desc: 'Монеты дают +8', cost: 40 },
            { id: 'ring', name: 'Перстень Удачи', icon: '💍', desc: 'Алмазы x2 к выигрышу', cost: 70 },
            { id: 'battery', name: 'Батарейка', icon: '🔋', desc: '+2 спина каждый этап', cost: 50 },
            { id: 'orb', name: 'Хрустальный Шар', icon: '🔮', desc: 'Джокер дает 35 монет', cost: 60 },
            { id: 'amulet', name: 'Оберег', icon: '🧿', desc: '+5 монет при пустом спине', cost: 30 },
            { id: 'crown', name: 'Корона Азарта', icon: '👑', desc: 'x3 к кушу если мало монет', cost: 80 },
            { id: 'dice', name: 'Кости Удачи', icon: '🎲', desc: '+2..20 монет случайный бонус', cost: 45 },
            { id: 'hourglass', name: 'Песочные Часы', icon: '⏳', desc: '1 спасительный спин', cost: 65 },
            { id: 'emerald', name: 'Изумруд', icon: '💎', desc: '+15% ко всему выигрышу', cost: 75 },
            { id: 'scroll', name: 'Древний Свиток', icon: '📜', desc: '-20% к стоимости аренды', cost: 90 },
            { id: 'key', name: 'Золотой Ключ', icon: '🗝️', desc: 'Расширяет слоты до 8', cost: 100 }
        ];

        const SYMBOLS = {
            '🍒': 3, '🍋': 4, '🍇': 6, '🔔': 10, '💎': 25, '7️⃣': 50, '☘': 12, '🪙': 8, '🃏': 15
        };

        let gameState = {
            coins: 40, quota: 100, spinsLeft: 5, stage: 1,
            maxSlots: 6,
            deck: ['🍒','🍒','🍋','🍋','🍇','🔔','☘','🪙','🪙','🃏'],
            artifacts: []
        };

        function updateUI() {
            document.getElementById('uiCoins').innerText = gameState.coins;
            document.getElementById('uiQuota').innerText = gameState.quota;
            document.getElementById('uiSpins').innerText = gameState.spinsLeft;
        }

        /* Three.js Engine Setup */
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020503, 0.08);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.position.set(0, 1.6, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        /* Lighting */
        scene.add(new THREE.AmbientLight(0x0a2412, 1.5));
        const light = new THREE.PointLight(0x00ff66, 2, 12);
        light.position.set(0, 3, 0);
        scene.add(light);

        /* Environment Build */
        function buildRoom() {
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x061209, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x030a05, roughness: 0.9 });
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMat);
            backWall.position.set(0, 2, -5);
            scene.add(backWall);
        }
        buildRoom();

        /* Interactive Objects */
        const interactables = [];

        // Center Slot Machine
        const slotMachine = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 2.0, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x112b18 })
        );
        slotMachine.position.set(0, 1.0, -1.2);
        slotMachine.userData = { type: 'slot', label: 'Игровой Автомат\n[ Нажмите E для Спина ]' };
        scene.add(slotMachine);
        interactables.push(slotMachine);

        // Reels Visualization
        const reelsMesh = [];
        for (let i = 0; i < 3; i++) {
            const r = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16),
                new THREE.MeshStandardMaterial({ color: 0x00ff66, wireframe: true })
            );
            r.rotation.z = Math.PI / 2;
            r.position.set((i - 1) * 0.38, 1.1, -0.75);
            scene.add(r);
            reelsMesh.push(r);
        }

        // Left Terminal: Shop
        const shopTerm = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.4, 0.6),
            new THREE.MeshStandardMaterial({ color: 0x1a3821 })
        );
        shopTerm.position.set(-2.2, 0.7, -2.0);
        shopTerm.userData = { type: 'shop', label: 'Терминал Магазина\n[ Нажмите E ]' };
        scene.add(shopTerm);
        interactables.push(shopTerm);

        // Right Terminal: Deck Info
        const deckTerm = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 1.4, 0.6),
            new THREE.MeshStandardMaterial({ color: 0x2b211a })
        );
        deckTerm.position.set(2.2, 0.7, -2.0);
        deckTerm.userData = { type: 'deck', label: 'Киоск Колоды\n[ Нажмите E ]' };
        scene.add(deckTerm);
        interactables.push(deckTerm);

        /* Touch & Movement Control State */
        const moveState = { forward: false, backward: false, left: false, right: false };
        let yaw = 0, pitch = 0;
        let lastTouchX = 0, lastTouchY = 0;

        // D-Pad Touch Listeners
        function bindDPad(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); moveState[key] = true; audio.init(); };
            const end = (e) => { e.preventDefault(); moveState[key] = false; };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        }
        bindDPad('btnUp', 'forward');
        bindDPad('btnDown', 'backward');
        bindDPad('btnLeft', 'left');
        bindDPad('btnRight', 'right');

        // Touch Look Zone Listeners
        const touchZone = document.getElementById('touchLookZone');
        touchZone.addEventListener('touchstart', (e) => {
            audio.init();
            const t = e.touches[0];
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
        });

        touchZone.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            const dx = t.clientX - lastTouchX;
            const dy = t.clientY - lastTouchY;
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;

            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        });

        /* Raycasting & Interaction */
        const raycaster = new THREE.Raycaster();
        let targetObject = null;

        function checkInteractions() {
            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            // Movement Physics
            const speed = 0.045;
            const dir = new THREE.Vector3();
            if (moveState.forward) dir.z -= 1;
            if (moveState.backward) dir.z += 1;
            if (moveState.left) dir.x -= 1;
            if (moveState.right) dir.x += 1;

            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.x = Math.max(-3.8, Math.min(3.8, camera.position.x + dir.x * speed));
            camera.position.z = Math.max(-3.8, Math.min(3.8, camera.position.z + dir.z * speed));

            // Raycast
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(interactables);

            const promptEl = document.getElementById('uiPrompt');
            if (hits.length > 0 && hits[0].distance < 3.2) {
                targetObject = hits[0].object;
                promptEl.innerText = targetObject.userData.label;
                promptEl.style.display = 'block';
            } else {
                targetObject = null;
                promptEl.style.display = 'none';
            }
        }

        function executeInteraction() {
            audio.init();
            if (!targetObject) return;

            audio.playTone(500, 'sine', 0.05);
            const type = targetObject.userData.type;

            if (type === 'slot') triggerSpin();
            if (type === 'shop') openShopModal();
            if (type === 'deck') openDeckModal();
        }

        /* Gameplay Logic */
        let isSpinning = false;
        function triggerSpin() {
            if (isSpinning || gameState.spinsLeft <= 0) return;

            isSpinning = true;
            gameState.spinsLeft--;
            updateUI();

            // Spin animation
            let ticks = 0;
            const interval = setInterval(() => {
                reelsMesh.forEach(r => r.rotation.x += 0.4);
                audio.playTone(150 + Math.random() * 80, 'triangle', 0.02, 0.02);
                ticks++;

                if (ticks > 15) {
                    clearInterval(interval);
                    isSpinning = false;

                    // Calculate outcome
                    let gain = 0;
                    const res = [
                        gameState.deck[Math.floor(Math.random() * gameState.deck.length)],
                        gameState.deck[Math.floor(Math.random() * gameState.deck.length)],
                        gameState.deck[Math.floor(Math.random() * gameState.deck.length)]
                    ];

                    res.forEach(s => gain += SYMBOLS[s] || 2);

                    // Apply Artifact Effects
                    if (gameState.artifacts.some(a => a.id === 'emerald')) gain = Math.floor(gain * 1.15);
                    if (gameState.artifacts.some(a => a.id === 'dice')) gain += Math.floor(Math.random() * 19) + 2;

                    gameState.coins += gain;
                    audio.playTone(800, 'sine', 0.15, 0.1);
                    updateUI();

                    if (gameState.coins >= gameState.quota) {
                        gameState.stage++;
                        let quotaMult = gameState.artifacts.some(a => a.id === 'scroll') ? 1.3 : 1.5;
                        gameState.quota = Math.floor(gameState.quota * quotaMult);
                        let extraSpins = gameState.artifacts.some(a => a.id === 'battery') ? 7 : 5;
                        gameState.spinsLeft = extraSpins;
                        updateUI();
                    }
                }
            }, 60);
        }

        function openShopModal() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';

            ARTIFACTS_DATABASE.forEach(art => {
                const bought = gameState.artifacts.some(a => a.id === art.id);
                const el = document.createElement('div');
                el.className = 'shop-card';
                el.innerHTML = `
                    <div class="shop-card-icon">${art.icon}</div>
                    <div class="shop-card-title">${art.name}</div>
                    <div class="shop-card-desc">${art.desc}</div>
                    <button class="btn" ${bought || gameState.coins < art.cost ? 'disabled' : ''}>
                        ${bought ? 'КУПЛЕНО' : art.cost + ' 🪙'}
                    </button>
                `;
                el.querySelector('button').onclick = () => {
                    if (!bought && gameState.coins >= art.cost) {
                        gameState.coins -= art.cost;
                        gameState.artifacts.push(art);
                        if (art.id === 'key') gameState.maxSlots = 8;
                        updateUI();
                        openShopModal();
                    }
                };
                grid.appendChild(el);
            });
            document.getElementById('shopModal').style.display = 'flex';
        }

        function openDeckModal() {
            const grid = document.getElementById('deckGrid');
            grid.innerHTML = '';
            const counts = {};
            gameState.deck.forEach(s => counts[s] = (counts[s] || 0) + 1);

            for (const [sym, count] of Object.entries(counts)) {
                const el = document.createElement('div');
                el.className = 'shop-card';
                el.innerHTML = `<div class="shop-card-icon">${sym}</div><div class="shop-card-desc">Всего: ${count} шт.</div>`;
                grid.appendChild(el);
            }
            document.getElementById('deckModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        /* Window Resize */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* Main Loop */
        function animate() {
            requestAnimationFrame(animate);
            checkInteractions();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            updateUI();
            animate();
        };
    </script>
</body>
</html>
