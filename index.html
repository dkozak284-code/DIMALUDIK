<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ОБИТАТЕЛЬ 5_0_5</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #020000;
            background-image: radial-gradient(circle, #250000 0%, #020000 90%);
            color: #fff;
            font-family: 'Creepster', cursive, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Кнопка Шестерёнки */
        .gear-btn {
            position: fixed;
            top: 12px;
            right: 15px;
            font-size: 1.3rem;
            color: #ff0000;
            background: rgba(15, 0, 0, 0.9);
            border: 2px solid #800000;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 0 10px #ff0000;
            transition: transform 0.3s ease;
        }
        .gear-btn:active {
            transform: rotate(90deg) scale(0.9);
        }

        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.4s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Главное Меню */
        .menu-container {
            text-align: center;
            background: rgba(10, 0, 0, 0.95);
            padding: 16px 25px;
            border: 2px solid #600000;
            box-shadow: 0 0 30px #ff0000, inset 0 0 15px #300000;
            border-radius: 12px;
            width: 420px;
            max-width: 80vw;
        }
        h1 {
            font-size: 2rem;
            color: #ff0000;
            text-shadow: 0 0 8px #ff0000, 0 0 18px #800000;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .main-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .menu-btn {
            padding: 8px 12px;
            background: linear-gradient(180deg, #200000, #0a0000);
            color: #ff3333;
            border: 1px solid #ff0000;
            border-radius: 6px;
            font-size: 1.1rem;
            font-family: 'Creepster', cursive;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 15px #ff0000;
        }

        /* Игровое Пространство и Автомат */
        .game-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* HUD Панель Сверху */
        .hud-panel {
            position: absolute;
            top: -45px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 6px #ff0000;
        }
        .balance-box {
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border: 1px solid #ffd700;
            border-radius: 4px;
        }

        /* Автомат в стиле скриншота 1 */
        .casino-cabinet {
            background: linear-gradient(180deg, #1f0000 0%, #050000 100%);
            border: 4px solid #b30000;
            box-shadow: 0 0 35px #ff0000, inset 0 0 25px #000;
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            width: 360px;
            max-width: 78vw;
            position: relative;
        }

        .win-banner {
            font-size: 1.2rem;
            height: 24px;
            line-height: 24px;
            color: #00ff66;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff66;
            margin-bottom: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .win-banner.active {
            opacity: 1;
        }

        /* Игровая Сетка 3х3 */
        .reels-frame {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            background: #000;
            border: 3px solid #ffaa00;
            border-radius: 8px;
            padding: 6px;
            margin: 4px 0 10px 0;
            box-shadow: 0 0 15px #ff5500, inset 0 0 15px #ff0000;
        }
        .reel {
            height: 50px;
            background: linear-gradient(180deg, #0a0000 0%, #1a0000 50%, #0a0000 100%);
            border: 2px solid #a800ff;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            box-shadow: inset 0 0 6px #000, 0 0 8px #a800ff;
        }

        /* Кнопки управления в автомате */
        .controls-row {
            display: flex;
            gap: 8px;
        }

        .spin-btn {
            flex: 2;
            background: linear-gradient(180deg, #cc0000, #400000);
            color: #fff;
            border: 2px solid #ff3333;
            padding: 8px 12px;
            font-size: 1.2rem;
            font-family: 'Creepster', cursive;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 12px #ff0000;
        }
        .spin-btn:active {
            transform: scale(0.97);
            background: #ff0000;
        }

        .shop-btn {
            flex: 1;
            background: linear-gradient(180deg, #d4af37, #5a480c);
            color: #000;
            border: 2px solid #ffd700;
            padding: 8px 12px;
            font-size: 1.1rem;
            font-family: 'Creepster', cursive;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px #ffd700;
        }
        .shop-btn:active {
            transform: scale(0.97);
        }

        /* Анимированный Рычаг (Справа от автомата) */
        .lever-container {
            position: absolute;
            right: -60px;
            top: 40px;
            width: 50px;
            height: 160px;
            cursor: pointer;
        }
        .lever-base {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 30px;
            height: 35px;
            background: linear-gradient(90deg, #333, #666, #222);
            border: 2px solid #111;
            border-radius: 6px;
            box-shadow: 0 0 8px #000;
        }
        .lever-arm {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 10px;
            height: 110px;
            background: linear-gradient(90deg, #888, #fff, #444);
            border-radius: 5px;
            transform-origin: bottom center;
            transform: rotate(20deg);
            transition: transform 0.15s ease-in-out;
        }
        .lever-ball {
            position: absolute;
            top: -18px;
            left: -11px;
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 30% 30%, #ff5555, #990000);
            border-radius: 50%;
            border: 2px solid #550000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Анимация нажатия рычага */
        .lever-container.pulled .lever-arm {
            transform: rotate(140deg) scaleY(0.7);
        }

        /* Окно Магазина (Соты) */
        .shop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        .shop-container {
            position: relative;
            width: 480px;
            height: 360px;
            max-width: 90vw;
            max-height: 70vh;
        }
        .shop-title {
            color: #ffd700;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 10px;
        }

        /* SVG Сетка сот */
        .hex-svg {
            width: 100%;
            height: 100%;
        }
        .hex-node {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hex-node:hover polygon {
            filter: brightness(1.2);
        }
        .hex-node.locked polygon {
            fill: #151515;
            stroke: #444;
            stroke-width: 2;
        }
        .hex-node.unlocked polygon {
            fill: #3a2800;
            stroke: #ffd700;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px #ffd700);
        }
        .hex-node.purchased polygon {
            fill: #003311;
            stroke: #00ff66;
            stroke-width: 3;
            filter: drop-shadow(0 0 8px #00ff66);
        }
        .hex-text-title {
            font-size: 11px;
            fill: #ffffff;
            font-family: sans-serif;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
        }
        .hex-text-status {
            font-size: 10px;
            fill: #ffd700;
            font-family: sans-serif;
            text-anchor: middle;
            pointer-events: none;
        }
        .hex-line {
            stroke: #444;
            stroke-width: 3;
            stroke-dasharray: 4;
        }
        .hex-line.active {
            stroke: #00ff66;
            stroke-dasharray: none;
        }

        /* Прочие Модальные Окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0a0000;
            border: 2px solid #800000;
            padding: 16px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px #ff0000;
            width: 360px;
            max-width: 80vw;
        }
        .modal-content h2 {
            color: #ff0000;
            margin-bottom: 10px;
            font-size: 1.6rem;
            border-bottom: 1px solid #400000;
            padding-bottom: 4px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            font-size: 1rem;
            color: #ffcccc;
        }
        .setting-row input[type="range"] {
            accent-color: #ff0000;
            width: 110px;
        }
        .setting-row input[type="checkbox"] {
            accent-color: #ff0000;
            width: 16px; height: 16px;
        }
        .authors-info {
            text-align: left;
            font-size: 1rem;
            color: #ffaaaa;
            margin: 8px 0;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .close-btn {
            padding: 8px 16px;
            background: #800000;
            color: #fff;
            border: 1px solid #ff0000;
            font-family: 'Creepster', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 4px;
        }

        #fadeOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        #fadeOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="gearBtn" class="gear-btn hidden" onclick="openGameSettings()">⚙</div>

    <div id="fadeOverlay"></div>

    <!-- Главное Меню -->
    <div id="menuScreen" class="screen">
        <div class="menu-container">
            <h1>ОБИТАТЕЛЬ 5_0_5</h1>
            <div class="main-btn-grid">
                <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
                <button class="menu-btn" onclick="openModal('settingsModal')">НАСТРОЙКИ</button>
                <button class="menu-btn" onclick="openModal('authorsModal')">АВТОРЫ</button>
                <button class="menu-btn" onclick="exitGame()">ВЫХОД</button>
            </div>
        </div>
    </div>

    <!-- Экран Игрового Автомата -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-wrapper">
            
            <div class="hud-panel">
                <div class="balance-box"><span id="balanceText">100</span> Φ</div>
                <div>МНОЖИТЕЛЬ: <span id="multText" style="color: #00ff66;">x1</span></div>
            </div>

            <div class="casino-cabinet">
                <div id="winBanner" class="win-banner">+0 Φ</div>
                
                <div class="reels-frame">
                    <div class="reel" id="r0">💀</div>
                    <div class="reel" id="r1">🩸</div>
                    <div class="reel" id="r2">👁️</div>
                    <div class="reel" id="r3">7️⃣</div>
                    <div class="reel" id="r4">🔪</div>
                    <div class="reel" id="r5">🔔</div>
                    <div class="reel" id="r6">🕯️</div>
                    <div class="reel" id="r7">🍒</div>
                    <div class="reel" id="r8">💀</div>
                </div>

                <div class="controls-row">
                    <button class="spin-btn" onclick="pullLeverAndSpin()">КРУТИТЬ (10 Φ)</button>
                    <button class="shop-btn" onclick="openShop()">МАГАЗИН</button>
                </div>
            </div>

            <!-- Анимированный Рычаг -->
            <div class="lever-container" id="leverContainer" onclick="pullLeverAndSpin()">
                <div class="lever-base"></div>
                <div class="lever-arm">
                    <div class="lever-ball"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Магазин со свойствами сот -->
    <div class="shop-modal" id="shopModal">
        <h2 class="shop-title">ДРЕВО УЛУЧШЕНИЙ</h2>
        <div class="shop-container">
            <svg class="hex-svg" viewBox="0 0 500 360" id="hexSvg">
                <!-- Линии связи сот генерируются через JS -->
            </svg>
        </div>
        <button class="close-btn" style="margin-top: 10px; background: #ff0000; color: #000;" onclick="closeShop()">ЗАКРЫТЬ</button>
    </div>

    <!-- Внутриигровые Настройки -->
    <div class="modal" id="gameGearModal">
        <div class="modal-content">
            <h2>ПАУЗА И НАСТРОЙКИ</h2>
            <div class="setting-row">
                <label>Звуки:</label>
                <input type="range" min="0" max="100" value="80">
            </div>
            <div class="setting-row">
                <label>Музыка:</label>
                <input type="range" min="0" max="100" value="60">
            </div>
            <div class="setting-row">
                <label>Свечение:</label>
                <input type="checkbox" checked>
            </div>
            <div class="modal-actions">
                <button class="close-btn" style="background: #200000;" onclick="goToMainMenu()">В МЕНЮ</button>
                <button class="close-btn" onclick="closeModal('gameGearModal')">ПРОДОЛЖИТЬ</button>
            </div>
        </div>
    </div>

    <!-- Настройки Главного Меню -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>НАСТРОЙКИ</h2>
            <div class="setting-row">
                <label>Звуки:</label>
                <input type="range" min="0" max="100" value="80">
            </div>
            <div class="setting-row">
                <label>Музыка:</label>
                <input type="range" min="0" max="100" value="60">
            </div>
            <div class="setting-row">
                <label>Свечение:</label>
                <input type="checkbox" checked>
            </div>
            <button class="close-btn" style="margin-top: 12px; width: 100%;" onclick="closeModal('settingsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Авторы -->
    <div class="modal" id="authorsModal">
        <div class="modal-content">
            <h2>АВТОРЫ</h2>
            <div class="authors-info">
                <p>• Разработчик: Noel_Izumi</p>
                <p>• Тестировщик: Коля</p>
            </div>
            <button class="close-btn" style="margin-top: 12px; width: 100%;" onclick="closeModal('authorsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Окно Выхода -->
    <div class="modal" id="exitModal">
        <div class="modal-content">
            <h2>ВЫХОД</h2>
            <p style="color: #ff0000; font-size: 1.3rem; margin: 12px 0;">выйди самостоятельно</p>
            <button class="close-btn" style="width: 100%;" onclick="closeModal('exitModal')">ОК</button>
        </div>
    </div>

    <script>
        // Игровое Состояние
        let balance = 100;
        let multiplier = 1;
        let luckPercent = 0;
        let infiniteLuckLevel = 0;
        let isSpinning = false;

        // Данные Древа Сот (Магазин)
        const shopNodes = [
            { id: 0, x: 250, y: 180, title: "СТАРТ", cost: 0, type: "start", req: [], purchased: true },
            { id: 1, x: 250, y: 90,  title: "МНОЖИТЕЛЬ X2", cost: 150, type: "mult", value: 2, req: [0], purchased: false },
            { id: 2, x: 335, y: 135, title: "УДАЧА +5%", cost: 200, type: "luck", value: 5, req: [0], purchased: false },
            { id: 3, x: 335, y: 225, title: "МНОЖИТЕЛЬ X3", cost: 500, type: "mult", value: 3, req: [2], purchased: false },
            { id: 4, x: 250, y: 270, title: "МНОЖИТЕЛЬ X4", cost: 1200, type: "mult", value: 4, req: [3], purchased: false },
            { id: 5, x: 165, y: 225, title: "МНОЖИТЕЛЬ X5", cost: 3000, type: "mult", value: 5, req: [4], purchased: false },
            { id: 6, x: 165, y: 135, title: "БЕСК. УДАЧА (+1%)", cost: 250, type: "inf_luck", value: 1, req: [0], purchased: false }
        ];

        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const symbols = ['💀', '🩸', '👁️', '7️⃣', '🔪', '🔔', '🍒'];

        function updateUI() {
            document.getElementById('balanceText').innerText = balance;
            document.getElementById('multText').innerText = 'x' + multiplier;
        }

        function forceLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }
        window.addEventListener('click', forceLandscape, { once: true });
        window.addEventListener('touchstart', forceLandscape, { once: true });

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openGameSettings() { openModal('gameGearModal'); }

        function startGame() {
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            setTimeout(() => {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('gearBtn').classList.remove('hidden');
                fade.classList.remove('active');
                updateUI();
            }, 500);
        }

        function goToMainMenu() {
            closeModal('gameGearModal');
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            setTimeout(() => {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('gearBtn').classList.add('hidden');
                document.getElementById('menuScreen').classList.remove('hidden');
                fade.classList.remove('active');
            }, 500);
        }

        function exitGame() { openModal('exitModal'); }

        /* Логика Рычага и Вращения */
        function pullLeverAndSpin() {
            if (isSpinning) return;
            if (balance < 10) {
                alert("НЕДОСТАТОЧНО МОНЕТ! :(");
                return;
            }

            balance -= 10;
            updateUI();
            isSpinning = true;

            // Анимация дергания рычага
            let lever = document.getElementById('leverContainer');
            lever.classList.add('pulled');
            setTimeout(() => {
                lever.classList.remove('pulled');
            }, 300);

            let banner = document.getElementById('winBanner');
            banner.classList.remove('active');

            for (let i = 0; i < 9; i++) {
                document.getElementById('r' + i).innerText = '❓';
            }

            let grid = [];
            let totalLuck = luckPercent + (infiniteLuckLevel * 1);
            let forceWin = (Math.random() * 100) < totalLuck;

            if (forceWin) {
                let sym = symbols[Math.floor(Math.random() * symbols.length)];
                let line = winningLines[Math.floor(Math.random() * winningLines.length)];
                for (let i = 0; i < 9; i++) {
                    grid.push(symbols[Math.floor(Math.random() * symbols.length)]);
                }
                grid[line[0]] = sym;
                grid[line[1]] = sym;
                grid[line[2]] = sym;
            } else {
                for (let i = 0; i < 9; i++) {
                    grid.push(symbols[Math.floor(Math.random() * symbols.length)]);
                }
            }

            grid.forEach((sym, index) => {
                setTimeout(() => {
                    document.getElementById('r' + index).innerText = sym;
                }, 100 + index * 50);
            });

            setTimeout(() => {
                let winLinesCount = 0;
                winningLines.forEach(line => {
                    const [a, b, c] = line;
                    if (grid[a] === grid[b] && grid[b] === grid[c]) {
                        winLinesCount++;
                    }
                });

                if (winLinesCount > 0) {
                    let baseWin = winLinesCount * 40;
                    let totalWin = baseWin * multiplier;
                    balance += totalWin;
                    banner.innerText = `+${totalWin} Φ  :)`;
                    banner.classList.add('active');
                } else {
                    banner.innerText = "ПУСТО... :(";
                    banner.classList.add('active');
                }

                updateUI();
                isSpinning = false;
            }, 600);
        }

        /* Логика Магазина и Сот */
        function openShop() {
            renderShop();
            document.getElementById('shopModal').style.display = 'flex';
        }
        function closeShop() {
            document.getElementById('shopModal').style.display = 'none';
        }

        function createHexPolygonPoints(cx, cy, r) {
            let points = [];
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                let x = cx + r * Math.cos(angle);
                let y = cy + r * Math.sin(angle);
                points.push(`${x},${y}`);
            }
            return points.join(" ");
        }

        function renderShop() {
            let svg = document.getElementById('hexSvg');
            svg.innerHTML = '';

            // Отрисовка линий
            shopNodes.forEach(node => {
                node.req.forEach(reqId => {
                    let parent = shopNodes.find(n => n.id === reqId);
                    if (parent) {
                        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", parent.x);
                        line.setAttribute("y1", parent.y);
                        line.setAttribute("x2", node.x);
                        line.setAttribute("y2", node.y);
                        line.setAttribute("class", `hex-line ${node.purchased ? 'active' : ''}`);
                        svg.appendChild(line);
                    }
                });
            });

            // Отрисовка сот
            shopNodes.forEach(node => {
                let isUnlocked = node.req.length === 0 || node.req.some(reqId => shopNodes.find(n => n.id === reqId).purchased);
                let stateClass = node.purchased ? "purchased" : (isUnlocked ? "unlocked" : "locked");

                let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", `hex-node ${stateClass}`);
                g.onclick = () => buyUpgrade(node.id);

                let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                poly.setAttribute("points", createHexPolygonPoints(node.x, node.y, 40));
                g.appendChild(poly);

                let title = document.createElementNS("http://www.w3.org/2000/svg", "text");
                title.setAttribute("x", node.x);
                title.setAttribute("y", node.y - 4);
                title.setAttribute("class", "hex-text-title");
                title.textContent = node.title;
                g.appendChild(title);

                let status = document.createElementNS("http://www.w3.org/2000/svg", "text");
                status.setAttribute("x", node.x);
                status.setAttribute("y", node.y + 14);
                status.setAttribute("class", "hex-text-status");

                if (node.purchased && node.type !== "inf_luck") {
                    status.textContent = "КУПЛЕНО";
                } else if (node.type === "inf_luck") {
                    let cost = node.cost + (infiniteLuckLevel * 150);
                    status.textContent = `${cost} Φ (Ур. ${infiniteLuckLevel})`;
                } else if (isUnlocked) {
                    status.textContent = `${node.cost} Φ`;
                } else {
                    status.textContent = "ЗАКРЫТО";
                }
                g.appendChild(status);

                svg.appendChild(g);
            });
        }

        function buyUpgrade(id) {
            let node = shopNodes.find(n => n.id === id);
            if (!node) return;

            let isUnlocked = node.req.length === 0 || node.req.some(reqId => shopNodes.find(n => n.id === reqId).purchased);
            if (!isUnlocked) {
                alert("СНАЧАЛА ОТКРОЙТЕ ПРЕДЫДУЩИЕ СОТЫ! :(");
                return;
            }

            if (node.type === "inf_luck") {
                let currentCost = node.cost + (infiniteLuckLevel * 150);
                if (balance >= currentCost) {
                    balance -= currentCost;
                    infiniteLuckLevel++;
                    node.purchased = true;
                    updateUI();
                    renderShop();
                } else {
                    alert("НЕДОСТАТОЧНО МОНЕТ! :(");
                }
                return;
            }

            if (node.purchased) return;

            if (balance >= node.cost) {
                balance -= node.cost;
                node.purchased = true;

                if (node.type === "mult") multiplier = Math.max(multiplier, node.value);
                if (node.type === "luck") luckPercent += node.value;

                updateUI();
                renderShop();
            } else {
                alert("НЕДОСТАТОЧНО МОНЕТ! :(");
            }
        }
    </script>
</body>
</html>
