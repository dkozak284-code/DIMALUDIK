<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>ОБИТАТЕЛЬ 5_0_5</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            background-color: #000000;
            background-image: radial-gradient(circle, #1a0000 0%, #000000 85%);
            color: #fff;
            font-family: 'Creepster', cursive, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Кнопка Шестерёнки (Справа вверху, сдвинута от шторки и системных кнопок) */
        .gear-btn {
            position: fixed;
            top: calc(35px + env(safe-area-inset-top));
            right: calc(65px + env(safe-area-inset-right));
            font-size: 1.2rem;
            color: #ff0000;
            background: #080000;
            border: 2px solid #ff0000;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 0 12px #ff0000, inset 0 0 8px #550000;
            transition: transform 0.2s ease;
        }
        .gear-btn:active {
            transform: rotate(90deg) scale(0.9);
        }

        /* Кнопка Подсказки (Рядом с шестерёнкой) */
        .hint-btn {
            position: fixed;
            top: calc(35px + env(safe-area-inset-top));
            right: calc(115px + env(safe-area-inset-right));
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff0000;
            background: #080000;
            border: 2px solid #ff0000;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 0 12px #ff0000, inset 0 0 8px #550000;
            transition: transform 0.2s ease;
        }
        .hint-btn:active {
            transform: scale(0.9);
        }

        /* Кнопка Магазина (Справа отступаем от статуса времени) */
        .shop-btn-top {
            position: fixed;
            top: calc(35px + env(safe-area-inset-top));
            left: calc(25px + env(safe-area-inset-left));
            background: #000;
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 6px 16px;
            font-size: 1.1rem;
            font-family: 'Creepster', cursive;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px #ffd700, inset 0 0 6px #554400;
            z-index: 500;
            letter-spacing: 1px;
            transition: transform 0.2s ease;
        }
        .shop-btn-top:active {
            transform: scale(0.95);
        }

        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.3s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Главное Меню */
        .menu-container {
            text-align: center;
            background: #050000;
            padding: 20px 30px;
            border: 3px solid #ff0000;
            box-shadow: 0 0 35px #ff0000, inset 0 0 20px #400000;
            border-radius: 14px;
            width: 440px;
            max-width: 85vw;
        }
        h1 {
            font-size: 2.2rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #800000;
            margin-bottom: 16px;
            letter-spacing: 3px;
        }
        .main-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-btn {
            padding: 10px;
            background: #0a0000;
            color: #ff4444;
            border: 2px solid #ff0000;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Creepster', cursive;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.95);
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        /* Контейнер игрового автомата */
        .game-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transform: scale(0.95);
        }

        .machine-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            margin-right: 50px;
        }

        /* Корпус Игрового Автомата */
        .casino-cabinet {
            background: #050000;
            border: 3px solid #ff0000;
            box-shadow: 0 0 35px #ff0000, inset 0 0 30px #200000;
            border-radius: 16px;
            padding: 12px 16px 14px 16px;
            text-align: center;
            width: 410px;
            max-width: 75vw;
            position: relative;
        }

        /* Верхняя HUD Панель */
        .hud-panel-inside {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .balance-box {
            background: #000;
            color: #ffd700;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px #ffd700;
            padding: 2px 10px;
            border-radius: 6px;
        }
        .pity-box {
            color: #ff3333;
            text-shadow: 0 0 8px #ff0000;
            letter-spacing: 1px;
        }
        .mult-box {
            color: #ffffff;
            text-shadow: 0 0 6px #ffffff;
        }
        .mult-value {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .win-banner {
            font-size: 1.1rem;
            height: 22px;
            line-height: 22px;
            color: #00ff66;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff66;
            margin-bottom: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .win-banner.active {
            opacity: 1;
        }

        /* Игровая Сетка 3х3 */
        .reels-frame {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            background: #000;
            border: 3px solid #ff6600;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
            box-shadow: 0 0 20px #ff6600, inset 0 0 20px #ff0000;
        }
        .reel {
            height: 52px;
            background: #080000;
            border: 2px solid #a800ff;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            box-shadow: inset 0 0 8px #000, 0 0 10px #a800ff;
        }

        .lever-hint {
            font-size: 0.9rem;
            color: #ffaaaa;
            letter-spacing: 1px;
            text-shadow: 0 0 6px #ff0000;
        }

        /* Механический Рычаг */
        .lever-container {
            position: absolute;
            right: -55px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 150px;
            cursor: pointer;
            z-index: 100;
        }
        .lever-base {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 24px;
            height: 38px;
            background: linear-gradient(90deg, #222, #555, #111);
            border: 2px solid #000;
            border-radius: 4px;
            box-shadow: 0 0 8px #000;
        }
        .lever-arm {
            position: absolute;
            bottom: 25px;
            left: 17px;
            width: 10px;
            height: 100px;
            background: linear-gradient(90deg, #777, #eee, #333);
            border-radius: 5px;
            transform-origin: bottom center;
            transform: rotate(22deg);
            transition: transform 0.15s ease-in-out;
        }
        .lever-ball {
            position: absolute;
            top: -18px;
            left: -11px;
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 35% 35%, #ff4444, #990000, #440000);
            border-radius: 50%;
            border: 2px solid #330000;
            box-shadow: 0 0 12px #ff0000;
        }

        .lever-container.pulled .lever-arm {
            transform: rotate(135deg) scaleY(0.7);
        }

        /* Магазин */
        .shop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        .shop-title {
            color: #ffcc00;
            font-size: 2rem;
            text-shadow: 0 0 12px #ff6600, 0 0 25px #ff0000;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .shop-container {
            position: relative;
            width: 500px;
            height: 340px;
            max-width: 92vw;
            max-height: 68vh;
        }

        .hex-svg {
            width: 100%;
            height: 100%;
        }
        .hex-node {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hex-node:hover polygon {
            filter: brightness(1.25);
        }
        .hex-node.locked polygon {
            fill: #0d0d0d;
            stroke: #444;
            stroke-width: 2;
        }
        .hex-node.unlocked polygon {
            fill: #2a1f00;
            stroke: #ffd700;
            stroke-width: 3;
            filter: drop-shadow(0 0 8px #ffd700);
        }
        .hex-node.purchased polygon {
            fill: #002b0f;
            stroke: #00ff66;
            stroke-width: 3;
            filter: drop-shadow(0 0 10px #00ff66);
        }
        .hex-text-title {
            font-size: 11px;
            fill: #ffffff;
            font-family: sans-serif;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
        }
        .hex-text-status {
            font-size: 10px;
            fill: #ffd700;
            font-family: sans-serif;
            text-anchor: middle;
            pointer-events: none;
        }
        .hex-line {
            stroke: #333;
            stroke-width: 3;
            stroke-dasharray: 4;
        }
        .hex-line.active {
            stroke: #00ff66;
            stroke-dasharray: none;
        }

        .shop-close-btn {
            margin-top: 10px;
            background: #ff0000;
            color: #000;
            border: none;
            padding: 8px 30px;
            font-family: 'Creepster', cursive;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
            transition: transform 0.2s ease;
        }
        .shop-close-btn:active {
            transform: scale(0.95);
        }

        /* Модальные Окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #080000;
            border: 2px solid #ff0000;
            padding: 18px 22px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 25px #ff0000;
            width: 360px;
            max-width: 82vw;
        }
        .modal-content h2 {
            color: #ff0000;
            margin-bottom: 12px;
            font-size: 1.6rem;
            border-bottom: 1px solid #400000;
            padding-bottom: 4px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: 1rem;
            color: #ffcccc;
        }
        .setting-row input[type="range"] {
            accent-color: #ff0000;
            width: 120px;
        }
        .authors-info {
            text-align: left;
            font-size: 1.05rem;
            color: #ffaaaa;
            margin: 10px 0;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .close-btn {
            padding: 8px 16px;
            background: #800000;
            color: #fff;
            border: 1px solid #ff0000;
            font-family: 'Creepster', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 6px;
        }

        #fadeOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        #fadeOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Верхние кнопки (Сдвинуты вглубь экрана) -->
    <button id="shopBtnTop" class="shop-btn-top hidden" onclick="openShop()">МАГАЗИН</button>
    <div id="hintBtn" class="hint-btn hidden" onclick="openModal('hintModal')">?</div>
    <div id="gearBtn" class="gear-btn hidden" onclick="openGameSettings()">⚙</div>

    <div id="fadeOverlay"></div>

    <!-- Главное Меню -->
    <div id="menuScreen" class="screen">
        <div class="menu-container">
            <h1>ОБИТАТЕЛЬ 5_0_5</h1>
            <div class="main-btn-grid">
                <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
                <button class="menu-btn" onclick="openModal('settingsModal')">НАСТРОЙКИ</button>
                <button class="menu-btn" onclick="openModal('authorsModal')">АВТОРЫ</button>
                <button class="menu-btn" onclick="exitGame()">ВЫХОД</button>
            </div>
        </div>
    </div>

    <!-- Экран Игрового Автомата -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-wrapper">
            
            <div class="machine-wrapper">
                <div class="casino-cabinet">
                    <div class="hud-panel-inside">
                        <div class="balance-box"><span id="balanceText">50</span> Φ</div>
                        <div class="pity-box">ГАРАНТ: <span id="pityText">0/6</span></div>
                        <div class="mult-box">МНОЖИТЕЛЬ: <span id="multText" class="mult-value">X1</span></div>
                    </div>

                    <div id="winBanner" class="win-banner">+0 Φ</div>
                    
                    <div class="reels-frame">
                        <div class="reel" id="r0">💀</div>
                        <div class="reel" id="r1">🩸</div>
                        <div class="reel" id="r2">👁️</div>
                        <div class="reel" id="r3">7️⃣</div>
                        <div class="reel" id="r4">🔪</div>
                        <div class="reel" id="r5">🔔</div>
                        <div class="reel" id="r6">🕯️</div>
                        <div class="reel" id="r7">🍒</div>
                        <div class="reel" id="r8">💀</div>
                    </div>

                    <div class="lever-hint">ПОТЯНИ РЫЧАГ (5 Φ)</div>
                </div>

                <!-- Механический Рычаг -->
                <div class="lever-container" id="leverContainer" onclick="pullLeverAndSpin()">
                    <div class="lever-base"></div>
                    <div class="lever-arm">
                        <div class="lever-ball"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Магазин (Соты) -->
    <div class="shop-modal" id="shopModal">
        <h2 class="shop-title">ДРЕВО УЛУЧШЕНИЙ</h2>
        <div class="shop-container">
            <svg class="hex-svg" viewBox="0 0 500 340" id="hexSvg"></svg>
        </div>
        <button class="shop-close-btn" onclick="closeShop()">ЗАКРЫТЬ</button>
    </div>

    <!-- Модальное окно Подсказки -->
    <div class="modal" id="hintModal">
        <div class="modal-content">
            <h2>ПОДСКАЗКА</h2>
            <p style="color: #ff0000; font-size: 1.4rem; margin: 16px 0;">не подскажу :)</p>
            <button class="close-btn" style="width: 100%;" onclick="closeModal('hintModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Внутриигровые Настройки -->
    <div class="modal" id="gameGearModal">
        <div class="modal-content">
            <h2>ПАУЗА И НАСТРОЙКИ</h2>
            <div class="setting-row">
                <label>Скорость слотов:</label>
                <input type="range" id="slotSpeedGame" min="1" max="3" value="1" onchange="syncSpeedSetting(this.value)">
            </div>
            <div class="setting-row">
                <label>Звуки:</label>
                <input type="range" min="0" max="100" value="80">
            </div>
            <div class="setting-row">
                <label>Музыка:</label>
                <input type="range" min="0" max="100" value="60">
            </div>
            <div class="modal-actions">
                <button class="close-btn" style="background: #200000;" onclick="goToMainMenu()">В МЕНЮ</button>
                <button class="close-btn" onclick="closeModal('gameGearModal')">ПРОДОЛЖИТЬ</button>
            </div>
        </div>
    </div>

    <!-- Настройки Главного Меню -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>НАСТРОЙКИ</h2>
            <div class="setting-row">
                <label>Скорость слотов:</label>
                <input type="range" id="slotSpeedMenu" min="1" max="3" value="1" onchange="syncSpeedSetting(this.value)">
            </div>
            <div class="setting-row">
                <label>Звуки:</label>
                <input type="range" min="0" max="100" value="80">
            </div>
            <div class="setting-row">
                <label>Музыка:</label>
                <input type="range" min="0" max="100" value="60">
            </div>
            <button class="close-btn" style="margin-top: 14px; width: 100%;" onclick="closeModal('settingsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Авторы -->
    <div class="modal" id="authorsModal">
        <div class="modal-content">
            <h2>АВТОРЫ</h2>
            <div class="authors-info">
                <p>• Разработчик: Noel_Izumi</p>
                <p>• Тестировщик: Коля</p>
            </div>
            <button class="close-btn" style="margin-top: 14px; width: 100%;" onclick="closeModal('authorsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Выход -->
    <div class="modal" id="exitModal">
        <div class="modal-content">
            <h2>ВЫХОД</h2>
            <p style="color: #ff0000; font-size: 1.3rem; margin: 12px 0;">выйди самостоятельно :)</p>
            <button class="close-btn" style="width: 100%;" onclick="closeModal('exitModal')">ОК</button>
        </div>
    </div>

    <script>
        let balance = 50;
        let multiplier = 1;
        let multiplierLevel = 0;
        let luckPercent = 0;
        let infiniteLuckLevel = 0;
        let isSpinning = false;
        
        let pityCounter = 0;
        let slotSpeedSetting = 1;

        const shopNodes = [
            { id: 0, x: 250, y: 170, title: "СТАРТ", cost: 0, type: "start", req: [], purchased: true },
            { id: 1, x: 250, y: 70,  title: "БЕСК. МНОЖИТЕЛЬ", baseCost: 100, type: "inf_mult", req: [0], purchased: false },
            { id: 2, x: 340, y: 120, title: "УДАЧА +5%", cost: 80, type: "luck", value: 5, req: [0], purchased: false },
            { id: 3, x: 340, y: 220, title: "МНОЖИТЕЛЬ +1", cost: 150, type: "mult_add", value: 1, req: [2], purchased: false },
            { id: 4, x: 250, y: 270, title: "УДАЧА +10%", cost: 250, type: "luck", value: 10, req: [3], purchased: false },
            { id: 5, x: 160, y: 220, title: "МНОЖИТЕЛЬ +1", cost: 400, type: "mult_add", value: 1, req: [4], purchased: false },
            { id: 6, x: 160, y: 120, title: "БЕСК. УДАЧА (+1%)", baseCost: 100, type: "inf_luck", req: [0], purchased: false }
        ];

        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const symbols = ['💀', '🩸', '👁️', '7️⃣', '🔪', '🔔', '🍒'];

        function updateUI() {
            document.getElementById('balanceText').innerText = balance;
            document.getElementById('multText').innerText = 'X' + multiplier;
            document.getElementById('pityText').innerText = pityCounter + '/6';
        }

        function syncSpeedSetting(val) {
            slotSpeedSetting = parseInt(val);
            document.getElementById('slotSpeedGame').value = val;
            document.getElementById('slotSpeedMenu').value = val;
        }

        function enableFullScreen() {
            let doc = document.documentElement;
            if (doc.requestFullscreen) {
                doc.requestFullscreen().catch(() => {});
            } else if (doc.webkitRequestFullscreen) {
                doc.webkitRequestFullscreen();
            } else if (doc.msRequestFullscreen) {
                doc.msRequestFullscreen();
            }
        }

        window.addEventListener('click', enableFullScreen, { once: true });
        window.addEventListener('touchstart', enableFullScreen, { once: true });

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openGameSettings() { openModal('gameGearModal'); }

        function startGame() {
            enableFullScreen();
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            setTimeout(() => {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('gearBtn').classList.remove('hidden');
                document.getElementById('hintBtn').classList.remove('hidden');
                document.getElementById('shopBtnTop').classList.remove('hidden');
                fade.classList.remove('active');
                updateUI();
            }, 400);
        }

        function goToMainMenu() {
            closeModal('gameGearModal');
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            setTimeout(() => {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('gearBtn').classList.add('hidden');
                document.getElementById('hintBtn').classList.add('hidden');
                document.getElementById('shopBtnTop').classList.add('hidden');
                document.getElementById('menuScreen').classList.remove('hidden');
                fade.classList.remove('active');
            }, 400);
        }

        function exitGame() { openModal('exitModal'); }

        function pullLeverAndSpin() {
            if (isSpinning) return;
            if (balance < 5) {
                alert("НЕДОСТАТОЧНО МОНЕТ! :(");
                return;
            }

            balance -= 5;
            pityCounter++;
            updateUI();
            isSpinning = true;

            let lever = document.getElementById('leverContainer');
            lever.classList.add('pulled');
            setTimeout(() => lever.classList.remove('pulled'), 300);

            let banner = document.getElementById('winBanner');
            banner.classList.remove('active');

            let spinInterval = 130;
            let spinsCount = 16;
            let reelStagger = 180;

            if (slotSpeedSetting === 2) {
                spinInterval = 80; spinsCount = 12; reelStagger = 120;
            } else if (slotSpeedSetting === 3) {
                spinInterval = 50; spinsCount = 8; reelStagger = 70;
            }

            let grid = [];
            let totalLuck = luckPercent + (infiniteLuckLevel * 1);
            let forceWin = (Math.random() * 100) < totalLuck;

            if (pityCounter >= 6) {
                forceWin = true;
            }

            if (forceWin) {
                let sym = symbols[Math.floor(Math.random() * symbols.length)];
                let line = winningLines[Math.floor(Math.random() * winningLines.length)];
                for (let i = 0; i < 9; i++) {
                    grid.push(symbols[Math.floor(Math.random() * symbols.length)]);
                }
                grid[line[0]] = sym;
                grid[line[1]] = sym;
                grid[line[2]] = sym;
            } else {
                for (let i = 0; i < 9; i++) {
                    grid.push(symbols[Math.floor(Math.random() * symbols.length)]);
                }
            }

            for (let i = 0; i < 9; i++) {
                let reelElem = document.getElementById('r' + i);
                
                let interval = setInterval(() => {
                    reelElem.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                }, spinInterval);

                let stopDelay = (spinsCount * spinInterval) + (i * reelStagger);
                setTimeout(() => {
                    clearInterval(interval);
                    reelElem.innerText = grid[i];
                }, stopDelay);
            }

            let totalSpinTime = (spinsCount * spinInterval) + (8 * reelStagger) + 100;

            setTimeout(() => {
                let winLinesCount = 0;
                winningLines.forEach(line => {
                    const [a, b, c] = line;
                    if (grid[a] === grid[b] && grid[b] === grid[c]) {
                        winLinesCount++;
                    }
                });

                if (winLinesCount > 0) {
                    let baseWin = winLinesCount * 30;
                    let totalWin = baseWin * multiplier;
                    balance += totalWin;
                    pityCounter = 0;
                    banner.innerText = `+${totalWin} Φ  :)`;
                    banner.classList.add('active');
                } else {
                    banner.innerText = "ПУСТО... :(";
                    banner.classList.add('active');
                }

                updateUI();
                isSpinning = false;
            }, totalSpinTime);
        }

        function openShop() {
            renderShop();
            document.getElementById('shopModal').style.display = 'flex';
        }
        function closeShop() {
            document.getElementById('shopModal').style.display = 'none';
        }

        function createHexPolygonPoints(cx, cy, r) {
            let points = [];
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i;
                let x = cx + r * Math.cos(angle);
                let y = cy + r * Math.sin(angle);
                points.push(`${x},${y}`);
            }
            return points.join(" ");
        }

        function renderShop() {
            let svg = document.getElementById('hexSvg');
            svg.innerHTML = '';

            shopNodes.forEach(node => {
                node.req.forEach(reqId => {
                    let parent = shopNodes.find(n => n.id === reqId);
                    if (parent) {
                        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", parent.x);
                        line.setAttribute("y1", parent.y);
                        line.setAttribute("x2", node.x);
                        line.setAttribute("y2", node.y);
                        line.setAttribute("class", `hex-line ${node.purchased ? 'active' : ''}`);
                        svg.appendChild(line);
                    }
                });
            });

            shopNodes.forEach(node => {
                let isUnlocked = node.req.length === 0 || node.req.some(reqId => shopNodes.find(n => n.id === reqId).purchased);
                let stateClass = node.purchased ? "purchased" : (isUnlocked ? "unlocked" : "locked");

                let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", `hex-node ${stateClass}`);
                g.onclick = () => buyUpgrade(node.id);

                let poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                poly.setAttribute("points", createHexPolygonPoints(node.x, node.y, 40));
                g.appendChild(poly);

                let title = document.createElementNS("http://www.w3.org/2000/svg", "text");
                title.setAttribute("x", node.x);
                title.setAttribute("y", node.y - 4);
                title.setAttribute("class", "hex-text-title");
                title.textContent = node.title;
                g.appendChild(title);

                let status = document.createElementNS("http://www.w3.org/2000/svg", "text");
                status.setAttribute("x", node.x);
                status.setAttribute("y", node.y + 14);
                status.setAttribute("class", "hex-text-status");

                if (node.type === "inf_mult") {
                    let cost = node.baseCost + (multiplierLevel * 100);
                    status.textContent = `${cost} Φ (X${multiplier})`;
                } else if (node.type === "inf_luck") {
                    let cost = node.baseCost + (infiniteLuckLevel * 100);
                    status.textContent = `${cost} Φ (Ур. ${infiniteLuckLevel})`;
                } else if (node.purchased) {
                    status.textContent = "КУПЛЕНО";
                } else if (isUnlocked) {
                    status.textContent = `${node.cost} Φ`;
                } else {
                    status.textContent = "ЗАКРЫТО";
                }
                g.appendChild(status);

                svg.appendChild(g);
            });
        }

        function buyUpgrade(id) {
            let node = shopNodes.find(n => n.id === id);
            if (!node) return;

            let isUnlocked = node.req.length === 0 || node.req.some(reqId => shopNodes.find(n => n.id === reqId).purchased);
            if (!isUnlocked) {
                alert("СНАЧАЛА ОТКРОЙТЕ ПРЕДЫДУЩИЕ СОТЫ! :(");
                return;
            }

            if (node.type === "inf_mult") {
                let currentCost = node.baseCost + (multiplierLevel * 100);
                if (balance >= currentCost) {
                    balance -= currentCost;
                    multiplierLevel++;
                    multiplier += 1;
                    node.purchased = true;
                    updateUI();
                    renderShop();
                } else {
                    alert("НЕДОСТАТОЧНО МОНЕТ! :(");
                }
                return;
            }

            if (node.type === "inf_luck") {
                let currentCost = node.baseCost + (infiniteLuckLevel * 100);
                if (balance >= currentCost) {
                    balance -= currentCost;
                    infiniteLuckLevel++;
                    node.purchased = true;
                    updateUI();
                    renderShop();
                } else {
                    alert("НЕДОСТАТОЧНО МОНЕТ! :(");
                }
                return;
            }

            if (node.purchased) return;

            if (balance >= node.cost) {
                balance -= node.cost;
                node.purchased = true;

                if (node.type === "mult_add") multiplier += node.value;
                if (node.type === "luck") luckPercent += node.value;

                updateUI();
                renderShop();
            } else {
                alert("НЕДОСТАТОЧНО МОНЕТ! :(");
            }
        }
    </script>
</body>
