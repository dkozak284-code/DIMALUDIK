<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБИТАТЕЛЬ 5_0_5</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #050505;
            background-image: radial-gradient(circle, #3a0000 0%, #050505 85%);
            color: #fff;
            font-family: 'Creepster', cursive, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Экраны */
        .screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none !important;
        }

        /* Главный контейнер меню */
        .container {
            text-align: center;
            background: rgba(15, 0, 0, 0.9);
            padding: 25px 35px;
            border: 2px solid #800000;
            box-shadow: 0 0 35px #ff0000;
            border-radius: 12px;
            animation: pulse 2.5s infinite alternate;
            width: 320px;
            max-width: 90vw;
        }
        h1 {
            font-size: 2.2rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #800000;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Кнопки меню */
        .menu-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px 15px;
            background: #1a0000;
            color: #ff3333;
            border: 2px solid #ff0000;
            border-radius: 8px;
            font-size: 1.4rem;
            font-family: 'Creepster', cursive;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.96);
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        /* Модальные окна (Настройки / Авторы) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #110000;
            border: 2px solid #ff0000;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 25px #ff0000;
            width: 300px;
            max-width: 90vw;
        }
        .modal-content h2 {
            color: #ff0000;
            margin-bottom: 15px;
            font-size: 2rem;
        }
        .modal-content p {
            font-size: 1.2rem;
            margin: 8px 0;
            color: #ffcccc;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            font-size: 1.1rem;
            color: #ffaaaa;
        }
        .setting-row input[type="range"] {
            accent-color: #ff0000;
            width: 120px;
        }
        .setting-row input[type="checkbox"] {
            accent-color: #ff0000;
            width: 20px;
            height: 20px;
        }

        .close-btn {
            margin-top: 15px;
            padding: 8px 20px;
            background: #ff0000;
            color: #000;
            border: none;
            font-family: 'Creepster', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Чёрный экран перехода */
        #fadeOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.8s ease;
        }
        #fadeOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Казино (Слот-Машина) */
        .casino-container {
            background: #110000;
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px #d4af37, inset 0 0 15px #ff0000;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 320px;
            max-width: 90vw;
        }
        .casino-title {
            color: #d4af37;
            font-size: 2.2rem;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 5px;
        }
        
        /* Надпись результата внутри игры */
        .win-status {
            font-size: 1.3rem;
            height: 35px;
            line-height: 35px;
            color: #ffd700;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
        }

        /* Барабаны */
        .reels-frame {
            display: flex;
            justify-content: space-around;
            background: #000;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px 5px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px #ff0000;
        }
        .reel {
            width: 70px;
            height: 70px;
            background: #1a1a1a;
            border: 2px solid #d4af37;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .spin-btn {
            background: linear-gradient(180deg, #ff0000, #800000);
            color: #fff;
            border: 2px solid #ffd700;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-family: 'Creepster', cursive;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
            width: 100%;
            margin-bottom: 10px;
        }
        .spin-btn:active {
            transform: scale(0.96);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #800000; }
            100% { box-shadow: 0 0 40px #ff0000; }
        }
    </style>
</head>
<body>

    <!-- Чёрный экран затемнения -->
    <div id="fadeOverlay"></div>

    <!-- Главное Меню -->
    <div id="menuScreen" class="screen">
        <div class="container">
            <h1>ОБИТАТЕЛЬ 5_0_5</h1>
            <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
            <button class="menu-btn" onclick="openModal('settingsModal')">НАСТРОЙКИ</button>
            <button class="menu-btn" onclick="openModal('authorsModal')">АВТОРЫ</button>
            <button class="menu-btn" onclick="exitGame()">ВЫХОД</button>
        </div>
    </div>

    <!-- Экран Казино -->
    <div id="gameScreen" class="screen hidden">
        <div class="casino-container">
            <h1 class="casino-title">КРАВАВОЕ КАЗИНО</h1>
            <div id="winStatus" class="win-status"></div>
            
            <div class="reels-frame">
                <div class="reel" id="reel1">💀</div>
                <div class="reel" id="reel2">7️⃣</div>
                <div class="reel" id="reel3">🩸</div>
            </div>

            <button class="spin-btn" onclick="spinReels()">КРУТИТЬ</button>
            <button class="menu-btn" style="font-size: 1.1rem; padding: 8px;" onclick="backToMenu()">В МЕНЮ</button>
        </div>
    </div>

    <!-- Окно Настройки -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>НАСТРОЙКИ</h2>
            <div class="setting-row">
                <label>Звуки:</label>
                <input type="range" min="0" max="100" value="80">
            </div>
            <div class="setting-row">
                <label>Музыка:</label>
                <input type="range" min="0" max="100" value="60">
            </div>
            <div class="setting-row">
                <label>Вибрация:</label>
                <input type="checkbox" checked>
            </div>
            <div class="setting-row">
                <label>Свечение:</label>
                <input type="checkbox" checked>
            </div>
            <button class="close-btn" onclick="closeModal('settingsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Окно Авторы -->
    <div class="modal" id="authorsModal">
        <div class="modal-content">
            <h2>АВТОРЫ</h2>
            <p>Разработчик: Noel_Izumi</p>
            <p>Тестировщик: Коля</p>
            <button class="close-btn" onclick="closeModal('authorsModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Выход из игры мгновенно без системных диалогов
        function exitGame() {
            if (navigator.app && navigator.app.exitApp) {
                navigator.app.exitApp();
            } else {
                window.opener = null;
                window.open('', '_self');
                window.close();
                history.back();
            }
        }

        // Переход в игру
        function startGame() {
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            
            setTimeout(() => {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                fade.classList.remove('active');
            }, 800);
        }

        // Возврат в меню
        function backToMenu() {
            let fade = document.getElementById('fadeOverlay');
            fade.classList.add('active');
            
            setTimeout(() => {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('menuScreen').classList.remove('hidden');
                fade.classList.remove('active');
            }, 800);
        }

        // Бесплатная вращалка
        const symbols = ['💀', '🩸', '7️⃣', '🍒', '🎃', '💎'];

        function spinReels() {
            let status = document.getElementById('winStatus');
            status.innerText = '';

            document.getElementById('reel1').innerText = '❓';
            document.getElementById('reel2').innerText = '❓';
            document.getElementById('reel3').innerText = '❓';

            let r1 = symbols[Math.floor(Math.random() * symbols.length)];
            let r2 = symbols[Math.floor(Math.random() * symbols.length)];
            let r3 = symbols[Math.floor(Math.random() * symbols.length)];

            setTimeout(() => { document.getElementById('reel1').innerText = r1; }, 200);
            setTimeout(() => { document.getElementById('reel2').innerText = r2; }, 400);
            setTimeout(() => { 
                document.getElementById('reel3').innerText = r3; 

                // Отображение выигрыша прямо над барабанами
                if (r1 === r2 && r2 === r3) {
                    status.innerText = "ДЖЕКПОТ! 🥳";
                    status.style.color = "#ffd700";
                } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                    status.innerText = "ВЫИГРЫШ! 🎉";
                    status.style.color = "#ff4444";
                } else {
                    status.innerText = "ПОПРОБУЙ ЕЩЁ!";
                    status.style.color = "#888888";
                }
            }, 600);
        }
    </script>
</body>
</html>
