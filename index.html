<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Slot Pit</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0a; font-family: sans-serif; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px; box-sizing: border-box; color: #eee; pointer-events: none;
  }
  .panel {
    background: rgba(20,20,20,0.75); border: 1px solid #444; border-radius: 8px;
    padding: 10px 16px; font-size: 15px; line-height: 1.6;
  }
  #spinBtn {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 14px 40px; font-size: 18px; font-weight: bold;
    background: #7F1D1D; color: #fff; border: 2px solid #B91C1C;
    border-radius: 8px; cursor: pointer; pointer-events: auto;
  }
  #spinBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #message {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ff4444; font-size: 32px; font-weight: bold; text-shadow: 0 0 10px black;
    display: none; text-align: center;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="panel">Долг: <span id="debt">50</span></div>
  <div class="panel">Монеты: <span id="coins">0</span></div>
  <div class="panel">Спинов осталось: <span id="spins">5</span></div>
</div>
<button id="spinBtn">Крутить</button>
<div id="message"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<script>
(function(){

// ---------- Базовая сцена ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.08);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 4.5);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0a);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Свет (мрачная камера) ----------
scene.add(new THREE.AmbientLight(0x222233, 0.6));
const lamp = new THREE.PointLight(0xffaa55, 1.4, 10);
lamp.position.set(0, 3, 1);
scene.add(lamp);
const rimLight = new THREE.PointLight(0x3355ff, 0.4, 8);
rimLight.position.set(-2, 1, -2);
scene.add(rimLight);

// ---------- Комната-камера ----------
const rustyMat = new THREE.MeshStandardMaterial({ color: 0x3a3229, roughness: 0.9, metalness: 0.3 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1a16, roughness: 1 });

const room = new THREE.Group();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6,6), floorMat);
floor.rotation.x = -Math.PI/2;
room.add(floor);

function wall(w,h,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), rustyMat);
  m.position.set(x,y,z);
  m.rotation.y = ry;
  return m;
}
room.add(wall(6,4, 0,2,-3, 0));
room.add(wall(6,4, -3,2,0, Math.PI/2));
room.add(wall(6,4, 3,2,0, -Math.PI/2));
scene.add(room);

// ---------- Текстуры символов для барабанов ----------
const symbols = [
  { name: 'cherry', color: '#D8324E', value: 2 },
  { name: 'clover', color: '#1D9E75', value: 5 },
  { name: 'bell',   color: '#EF9F27', value: 8 },
  { name: 'seven',  color: '#7F1D1D', value: 15 },
  { name: 'diamond',color: '#378ADD', value: 20 }
];

function makeSymbolCanvas(sym){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,128,128);
  ctx.fillStyle = sym.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.beginPath();
  if (sym.name === 'cherry'){
    ctx.arc(48,80,22,0,Math.PI*2);
    ctx.arc(88,80,22,0,Math.PI*2);
  } else if (sym.name === 'clover'){
    for(let i=0;i<4;i++){
      const a = i*(Math.PI/2);
      ctx.moveTo(64+Math.cos(a)*22, 64+Math.sin(a)*22);
      ctx.arc(64+Math.cos(a)*22, 64+Math.sin(a)*22, 20, 0, Math.PI*2);
    }
  } else if (sym.name === 'bell'){
    ctx.moveTo(64,25);
    ctx.quadraticCurveTo(30,30,30,80);
    ctx.lineTo(98,80);
    ctx.quadraticCurveTo(98,30,64,25);
  } else if (sym.name === 'seven'){
    ctx.font = 'bold 90px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('7', 64, 95);
    ctx.fill(); ctx.stroke();
    return new THREE.CanvasTexture(c);
  } else if (sym.name === 'diamond'){
    ctx.moveTo(64,20); ctx.lineTo(100,64); ctx.lineTo(64,108); ctx.lineTo(28,64);
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();
  return new THREE.CanvasTexture(c);
}

const symbolTextures = symbols.map(makeSymbolCanvas);

// ---------- Игровой автомат ----------
const machine = new THREE.Group();
machine.position.set(0, 0, 0.5);
scene.add(machine);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8B1E2E, roughness: 0.5, metalness: 0.4 });
const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2, 0.7), bodyMat);
body.position.y = 1;
machine.add(body);

const screenMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x220000, roughness: 0.3 });
const screen = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.7, 0.05), screenMat);
screen.position.set(0, 1.5, 0.38);
machine.add(screen);

// Три барабана как отдельные "окошки" со сменными текстурами
const reels = [];
for (let i=0;i<3;i++){
  const mat = new THREE.MeshBasicMaterial({ map: symbolTextures[0] });
  const reel = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.35), mat);
  reel.position.set(-0.4 + i*0.4, 1.5, 0.41);
  machine.add(reel);
  reels.push({ mesh: reel, symbolIndex: 0, spinning: false });
}

const lever = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04,0.04,0.7),
  new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 })
);
lever.position.set(0.95, 1.6, 0);
lever.rotation.z = -0.3;
machine.add(lever);

// ---------- ATM сбоку ----------
const atm = new THREE.Mesh(
  new THREE.BoxGeometry(0.6, 1.4, 0.4),
  new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6 })
);
atm.position.set(-1.8, 0.7, -1);
scene.add(atm);

// ---------- Лёгкое вращение камеры мышкой ----------
let camAngle = 0, dragging = false, lastX = 0;
renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camAngle += (e.clientX - lastX) * 0.005;
  lastX = e.clientX;
});

function updateCamera(){
  const r = 4.5;
  camera.position.x = Math.sin(camAngle) * r;
  camera.position.z = Math.cos(camAngle) * r;
  camera.lookAt(0, 1.3, 0.5);
}

// ---------- Игровая логика ----------
let coins = 0, debt = 50, spinsLeft = 5, round = 1, spinning = false;

const debtEl = document.getElementById('debt');
const coinsEl = document.getElementById('coins');
const spinsEl = document.getElementById('spins');
const spinBtn = document.getElementById('spinBtn');
const message = document.getElementById('message');

function updateUI(){
  debtEl.textContent = debt;
  coinsEl.textContent = coins;
  spinsEl.textContent = spinsLeft;
}

function showMessage(text, color){
  message.textContent = text;
  message.style.color = color || '#ff4444';
  message.style.display = 'block';
  setTimeout(() => message.style.display = 'none', 2200);
}

function spin(){
  if (spinning || spinsLeft <= 0) return;
  spinning = true;
  spinBtn.disabled = true;
  spinsLeft--;

  const result = [];
  let ticks = 0;
  const maxTicks = 20;

  const interval = setInterval(() => {
    reels.forEach(r => {
      r.symbolIndex = Math.floor(Math.random()*symbols.length);
      r.mesh.material.map = symbolTextures[r.symbolIndex];
      r.mesh.material.needsUpdate = true;
    });
    ticks++;
    if (ticks >= maxTicks){
      clearInterval(interval);
      finishSpin();
    }
  }, 60);
}

function finishSpin(){
  const idxs = reels.map(r => r.symbolIndex);
  let payout = 0;
  if (idxs[0] === idxs[1] && idxs[1] === idxs[2]){
    payout = symbols[idxs[0]].value * 5;
    showMessage('Джекпот! +' + payout, '#44ff88');
  } else if (idxs[0] === idxs[1] || idxs[1] === idxs[2] || idxs[0] === idxs[2]){
    const matchIdx = idxs[0] === idxs[1] ? idxs[0] : (idxs[1] === idxs[2] ? idxs[1] : idxs[0]);
    payout = symbols[matchIdx].value;
    showMessage('Совпадение! +' + payout, '#ffcc44');
  }
  coins += payout;
  updateUI();

  if (spinsLeft <= 0){
    if (coins >= debt){
      coins -= debt;
      round++;
      debt = Math.floor(debt * 1.6);
      spinsLeft = 5;
      showMessage('Долг погашен! Раунд ' + round, '#44ff88');
      updateUI();
    } else {
      showMessage('Пол разверзается... КОНЕЦ ИГРЫ', '#ff2222');
      spinBtn.disabled = true;
      dropFloor();
      spinning = false;
      return;
    }
  }
  spinning = false;
  spinBtn.disabled = false;
}

function dropFloor(){
  const anim = () => {
    if (floor.position.y > -5){
      floor.position.y -= 0.05;
      requestAnimationFrame(anim);
    }
  };
  anim();
}

spinBtn.addEventListener('click', spin);
updateUI();

// ---------- Рендер-цикл ----------
function animate(){
  requestAnimationFrame(animate);
  lamp.intensity = 1.2 + Math.sin(Date.now()*0.003)*0.15; // мерцание лампы
  updateCamera();
  renderer.render(scene, camera);
}
animate();

})();
</script>
</body>
</html>
