<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Game Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            background-image: radial-gradient(circle, #3a0000 0%, #050505 85%);
            color: #fff;
            font-family: 'Creepster', cursive, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(15, 0, 0, 0.85);
            padding: 25px 40px;
            border: 2px solid #800000;
            box-shadow: 0 0 35px #ff0000;
            border-radius: 12px;
            animation: pulse 2.5s infinite alternate;
        }
        h1 {
            font-size: 2.8rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #800000;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
        .menu-btn {
            display: block;
            width: 240px;
            margin: 12px auto;
            padding: 12px 20px;
            background: #1a0000;
            color: #ff3333;
            border: 2px solid #ff0000;
            border-radius: 8px;
            font-size: 1.5rem;
            font-family: 'Creepster', cursive;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .menu-btn:hover, .menu-btn:active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 25px #ff0000;
            transform: scale(1.05);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px #800000; }
            100% { box-shadow: 0 0 40px #ff0000; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ОБИТЕЛЬ СТРАХА</h1>
        <button class="menu-btn" onclick="alert('Запуск игры...')">ИГРАТЬ</button>
        <button class="menu-btn" onclick="alert('Настройки')">НАСТРОЙКИ</button>
        <button class="menu-btn" onclick="alert('Авторы')">АВТОРЫ</button>
        <button class="menu-btn" onclick="alert('Выход')">ВЫХОД</button>
    </div>
</body>
</html>
