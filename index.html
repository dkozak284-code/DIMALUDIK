<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLOVER PIT 3D: ROGUELIKE SLOT</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --color-bg: #030704;
            --color-panel: rgba(10, 20, 13, 0.75);
            --color-border: #1a3821;
            --color-neon-green: #00ff66;
            --color-neon-gold: #ffd700;
            --color-neon-red: #ff3344;
            --color-neon-purple: #b042ff;
            --font-main: 'Share Tech Mono', monospace;
            --font-hud: 'VT323', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--color-bg);
            color: #e0ffe8;
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* CRT Overlay Effect */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.6;
        }

        #webgl-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* UI HUD Overlay */
        .ui-hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 12px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            padding: 6px 14px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .logo {
            font-family: var(--font-hud);
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            color: var(--color-neon-green);
            text-shadow: 0 0 8px var(--color-neon-green);
            letter-spacing: 2px;
        }

        .stats-group {
            display: flex;
            gap: 8px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-border);
            padding: 2px 10px;
            border-radius: 4px;
            text-align: center;
            min-width: 65px;
        }

        .stat-card .label {
            font-size: 0.65rem;
            color: #6a9c74;
            text-transform: uppercase;
        }

        .stat-card .val {
            font-family: var(--font-hud);
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--color-neon-gold);
            line-height: 1;
        }

        .stat-card .val.green { color: var(--color-neon-green); }
        .stat-card .val.red { color: var(--color-neon-red); }
        .stat-card .val.purple { color: var(--color-neon-purple); }

        /* Side Panels */
        .hud-middle {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            flex: 1;
            margin: 8px 0;
            overflow: hidden;
        }

        .panel-box {
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 8px;
            width: clamp(160px, 20vw, 220px);
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .panel-title {
            font-size: 0.75rem;
            color: var(--color-neon-green);
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .charm-item {
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--color-border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            position: relative;
            cursor: pointer;
        }

        .charm-item.active {
            border: 1px solid var(--color-neon-purple);
            box-shadow: 0 0 8px rgba(176, 66, 255, 0.3);
        }

        .charm-item:hover .tooltip {
            display: block;
        }

        .tooltip {
            display: none;
            position: absolute;
            left: 105%; top: 0;
            width: 150px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--color-neon-purple);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            z-index: 100;
            color: #fff;
            pointer-events: none;
        }

        .log-box {
            font-size: 0.75rem;
            color: #6a9c74;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .log-entry.win { color: var(--color-neon-gold); }
        .log-entry.info { color: var(--color-neon-green); }
        .log-entry.bad { color: var(--color-neon-red); }

        /* Controls Bottom Bar */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            padding: 8px 14px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .btn {
            background: #0e2b14;
            color: var(--color-neon-green);
            border: 1px solid var(--color-neon-green);
            padding: 6px 16px;
            font-family: var(--font-main);
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--color-neon-green);
            color: #000;
            box-shadow: 0 0 12px var(--color-neon-green);
        }

        .btn-spin {
            flex: 1;
            font-family: var(--font-hud);
            font-size: clamp(1.4rem, 3vw, 2rem);
            padding: 4px 20px;
            background: #184a22;
            letter-spacing: 2px;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #4a6350;
            color: #4a6350;
            background: #08120a;
            box-shadow: none;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }

        .modal-card {
            background: #0a140d;
            border: 1px solid var(--color-neon-green);
            border-radius: 8px;
            padding: 18px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-family: var(--font-hud);
            font-size: 1.8rem;
            color: var(--color-neon-gold);
            text-align: center;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 4px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }

        .shop-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
        }

        .shop-card-icon { font-size: 1.8rem; }
        .shop-card-title { font-size: 0.85rem; color: var(--color-neon-green); }
        .shop-card-desc { font-size: 0.7rem; color: #82a88a; flex: 1; }
        .shop-card-cost { font-family: var(--font-hud); font-size: 1.2rem; color: var(--color-neon-gold); }

        @media (max-width: 650px) {
            .hud-middle { flex-direction: column; }
            .panel-box { width: 100%; max-height: 80px; }
            .log-box { max-height: 50px; }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div id="webgl-container"></div>

    <div class="ui-hud">
        <header class="interactive">
            <div class="logo">☘ CLOVER PIT 3D</div>
            <div class="stats-group">
                <div class="stat-card">
                    <div class="label">Монеты</div>
                    <div class="val" id="uiCoins">0</div>
                </div>
                <div class="stat-card">
                    <div class="label">Аренда</div>
                    <div class="val red" id="uiQuota">100</div>
                </div>
                <div class="stat-card">
                    <div class="label">Спины</div>
                    <div class="val green" id="uiSpins">5</div>
                </div>
                <div class="stat-card">
                    <div class="label">Этап</div>
                    <div class="val purple" id="uiStage">1</div>
                </div>
            </div>
        </header>

        <div class="hud-middle">
            <div class="panel-box interactive">
                <div class="panel-title">АМУЛЕТЫ (<span id="uiCharmCount">0</span>/6)</div>
                <div class="charms-grid" id="uiCharmsGrid"></div>
            </div>

            <div class="panel-box interactive">
                <div class="panel-title">ЖУРНАЛ</div>
                <div class="log-box" id="uiLogBox"></div>
            </div>
        </div>

        <footer class="interactive">
            <button class="btn" onclick="openShopModal()">МАГАЗИН</button>
            <button class="btn btn-spin" id="btnSpin" onclick="startSpinSequence()">СПИН</button>
            <button class="btn" onclick="openDeckModal()">КОЛОДА</button>
        </footer>
    </div>

    <!-- Modals -->
    <div class="modal-overlay interactive" id="shopModal">
        <div class="modal-card">
            <div class="modal-title">ТЕРМИНАЛ ПОКУПОК</div>
            <div class="shop-grid" id="shopGrid"></div>
            <button class="btn" onclick="closeModal('shopModal')">ВЫХОД</button>
        </div>
    </div>

    <div class="modal-overlay interactive" id="deckModal">
        <div class="modal-card">
            <div class="modal-title">СИМВОЛЫ В КОЛОДЕ</div>
            <div class="shop-grid" id="deckGrid"></div>
            <button class="btn" onclick="closeModal('deckModal')">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div class="modal-overlay interactive" id="gameOverModal">
        <div class="modal-card" style="text-align: center;">
            <div class="modal-title" id="gameOverTitle" style="color: var(--color-neon-red);">ВЫ БАНКРОТ</div>
            <p id="gameOverDesc" style="font-size: 0.9rem; margin: 10px 0;"></p>
            <button class="btn btn-spin" onclick="resetFullGame()">НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>

    <script>
        /* Audio Engine */
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playTone(freq, type = 'sine', duration = 0.1, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playSpinTick() { this.init(); this.playTone(120 + Math.random() * 40, 'triangle', 0.03, 0.02); }
            playReelStop() { this.init(); this.playTone(80, 'square', 0.1, 0.1); }
            playCoin() { this.init(); this.playTone(1046.50, 'sine', 0.08, 0.08); }
            playWinFanfare() {
                this.init();
                [523.25, 659.25, 783.99, 1046.50].forEach((n, i) => {
                    setTimeout(() => this.playTone(n, 'triangle', 0.2, 0.08), i * 80);
                });
            }
            playError() { this.init(); this.playTone(110, 'sawtooth', 0.25, 0.15); }
        }
        const audio = new AudioEngine();

        /* Game Config */
        const SYMBOL_DATA = {
            '🍒': { name: 'Вишня', val: 3 }, '🍋': { name: 'Лимон', val: 4 },
            '🍇': { name: 'Виноград', val: 6 }, '🔔': { name: 'Колокол', val: 10 },
            '💎': { name: 'Алмаз', val: 25 }, '7️⃣': { name: 'Семерка', val: 50 },
            '☘': { name: 'Клевер', val: 12 }, '💀': { name: 'Череп', val: 0 },
            '🪙': { name: 'Монета', val: 8 }
        };

        const CHARMS_DATA = [
            { id: 'clover_master', name: 'Золотой Клевер', icon: '🍀', desc: '+30% за Клевер на экране', cost: 40 },
            { id: 'magnet', name: 'Магнит Монет', icon: '🧲', desc: 'Монеты дают +6 дополнительно', cost: 45 },
            { id: 'pact', name: 'Темная Сделка', icon: '📜', desc: 'Череп дает +60, но сжигает 1 спин', cost: 70 },
            { id: 'ring', name: 'Перстень', icon: '💍', desc: 'Алмазы удваивают выигрыш', cost: 85 }
        ];

        let gameState = {
            coins: 35, quota: 90, spinsLeft: 5, stage: 1,
            deck: ['🍒', '🍒', '🍋', '🍋', '🍇', '🔔', '☘', '🪙', '🪙'],
            charms: [], gridResults: []
        };

        function logEvent(msg, type = 'info') {
            const box = document.getElementById('uiLogBox');
            const el = document.createElement('div');
            el.className = `log-entry ${type}`;
            el.innerText = `> ${msg}`;
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('uiCoins').innerText = gameState.coins;
            document.getElementById('uiQuota').innerText = gameState.quota;
            document.getElementById('uiSpins').innerText = gameState.spinsLeft;
            document.getElementById('uiStage').innerText = gameState.stage;
            document.getElementById('uiCharmCount').innerText = gameState.charms.length;

            const grid = document.getElementById('uiCharmsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const slot = document.createElement('div');
                slot.className = 'charm-item';
                if (gameState.charms[i]) {
                    const c = gameState.charms[i];
                    slot.classList.add('active');
                    slot.innerText = c.icon;
                    slot.innerHTML += `<div class="tooltip"><strong>${c.name}</strong><br>${c.desc}</div>`;
                }
                grid.appendChild(slot);
            }
        }

        /* Three.JS Setup & Dynamic Camera Adjust */
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030704, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        
        function updateCameraAspect() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;

            // Dynamically adjust Z distance based on aspect ratio to fit the machine in view
            if (aspect < 0.8) {
                camera.position.set(0, 0.4, 7.8);
            } else if (aspect < 1.3) {
                camera.position.set(0, 0.5, 6.2);
            } else {
                camera.position.set(0, 0.6, 5.0);
            }
            camera.updateProjectionMatrix();
        }
        updateCameraAspect();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        /* Lights */
        const ambientLight = new THREE.AmbientLight(0x1a3821, 1.4);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0x00ff66, 2.0);
        spotLight.position.set(0, 4, 3);
        scene.add(spotLight);

        /* Machine Mesh */
        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        const bodyGeo = new THREE.BoxGeometry(2.0, 2.8, 1.2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111c14, roughness: 0.4, metalness: 0.6 });
        const machineBody = new THREE.Mesh(bodyGeo, bodyMat);
        machineGroup.add(machineBody);

        /* Reels */
        const reels = [];
        function createReelTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050f07'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const keys = Object.keys(SYMBOL_DATA);
            const step = canvas.height / keys.length;
            ctx.font = '70px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            keys.forEach((sym, idx) => {
                ctx.strokeStyle = '#1a3821'; ctx.lineWidth = 4;
                ctx.strokeRect(10, idx * step + 10, canvas.width - 20, step - 20);
                ctx.fillText(sym, canvas.width / 2, idx * step + step / 2);
            });
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const reelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 32);
        for (let i = 0; i < 3; i++) {
            const reelMat = new THREE.MeshStandardMaterial({ map: createReelTexture(), roughness: 0.3 });
            const reel = new THREE.Mesh(reelGeo, reelMat);
            reel.rotation.z = Math.PI / 2;
            reel.position.set((i - 1) * 0.52, 0.15, 0.45);
            machineGroup.add(reel);
            reels.push({ mesh: reel, isSpinning: false, rotationSpeed: 0 });
        }

        /* Resize Handler */
        window.addEventListener('resize', () => {
            updateCameraAspect();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* Game Mechanics */
        let isSpinningSequence = false;
        function startSpinSequence() {
            if (isSpinningSequence || gameState.spinsLeft <= 0) return;

            isSpinningSequence = true;
            gameState.spinsLeft--;
            document.getElementById('btnSpin').disabled = true;
            updateUI();

            gameState.gridResults = [];
            reels.forEach((reelObj, idx) => {
                reelObj.isSpinning = true;
                reelObj.rotationSpeed = 0.3 + idx * 0.08;
                const chosen = gameState.deck[Math.floor(Math.random() * gameState.deck.length)];
                gameState.gridResults.push(chosen);

                setTimeout(() => {
                    reelObj.isSpinning = false;
                    audio.playReelStop();
                    if (idx === 2) setTimeout(evaluateSpinResults, 300);
                }, 1000 + idx * 500);
            });
        }

        function evaluateSpinResults() {
            let totalGain = 0;
            const counts = {};
            gameState.gridResults.forEach(sym => counts[sym] = (counts[sym] || 0) + 1);

            logEvent(`Выпали: [ ${gameState.gridResults.join(' | ')} ]`, 'info');

            for (const [sym, count] of Object.entries(counts)) {
                let payout = (SYMBOL_DATA[sym] ? SYMBOL_DATA[sym].val : 2) * count;
                if (sym === '🪙' && gameState.charms.some(c => c.id === 'magnet')) payout += count * 6;
                if (sym === '💎' && gameState.charms.some(c => c.id === 'ring')) payout *= 2;
                totalGain += payout;
            }

            gameState.coins += totalGain;
            if (totalGain > 0) {
                audio.playWinFanfare();
                logEvent(`Выигрыш: +${totalGain} монет!`, 'win');
            }

            isSpinningSequence = false;
            document.getElementById('btnSpin').disabled = false;
            updateUI();

            if (gameState.coins >= gameState.quota) {
                logEvent('Аренда оплачена! Следующий этап.', 'win');
                gameState.stage++;
                gameState.quota = Math.floor(gameState.quota * 1.6);
                gameState.spinsLeft = 5;
                updateUI();
            } else if (gameState.spinsLeft <= 0) {
                audio.playError();
                document.getElementById('gameOverModal').style.display = 'flex';
            }
        }

        function resetFullGame() {
            gameState = { coins: 35, quota: 90, spinsLeft: 5, stage: 1, deck: ['🍒','🍒','🍋','🍋','🍇','🔔','☘','🪙','🪙'], charms: [], gridResults: [] };
            closeModal('gameOverModal');
            updateUI();
        }

        function openShopModal() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            CHARMS_DATA.forEach(c => {
                const bought = gameState.charms.some(x => x.id === c.id);
                const el = document.createElement('div');
                el.className = 'shop-card';
                el.innerHTML = `
                    <div class="shop-card-icon">${c.icon}</div>
                    <div class="shop-card-title">${c.name}</div>
                    <div class="shop-card-desc">${c.desc}</div>
                    <button class="btn" ${bought || gameState.coins < c.cost ? 'disabled' : ''}>${bought ? 'Есть' : c.cost + ' 🪙'}</button>
                `;
                el.querySelector('button').onclick = () => {
                    if (!bought && gameState.coins >= c.cost) {
                        gameState.coins -= c.cost;
                        gameState.charms.push(c);
                        audio.playCoin();
                        updateUI();
                        openShopModal();
                    }
                };
                grid.appendChild(el);
            });
            document.getElementById('shopModal').style.display = 'flex';
        }

        function openDeckModal() {
            const grid = document.getElementById('deckGrid');
            grid.innerHTML = '';
            const counts = {};
            gameState.deck.forEach(s => counts[s] = (counts[s] || 0) + 1);
            for (const [sym, count] of Object.entries(counts)) {
                const el = document.createElement('div');
                el.className = 'shop-card';
                el.innerHTML = `<div class="shop-card-icon">${sym}</div><div class="shop-card-desc">Количество: ${count}</div>`;
                grid.appendChild(el);
            }
            document.getElementById('deckModal').style.display = 'flex';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        /* Animation Loop */
        function animate() {
            requestAnimationFrame(animate);
            reels.forEach(r => {
                if (r.isSpinning) {
                    r.mesh.rotation.x += r.rotationSpeed;
                    audio.playSpinTick();
                } else {
                    r.mesh.rotation.x = THREE.MathUtils.lerp(r.mesh.rotation.x, Math.round(r.mesh.rotation.x / (Math.PI / 4)) * (Math.PI / 4), 0.2);
                }
            });
            renderer.render(scene, camera);
        }

        window.onload = () => {
            updateUI();
            logEvent('Запуск системы. Удача на вашей стороне.', 'info');
            animate();
        };
    </script>
</body>
</html>
